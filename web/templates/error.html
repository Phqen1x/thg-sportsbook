{% extends "base.html" %}
{% block title %}Error {{ code }} — Panem Sportsbook{% endblock %}

{% block content %}
<div class="error-page">
  <div class="error-code">{{ code }}</div>
  <div class="error-message">{{ message }}</div>
  <a href="{{ cta_url or '/' }}" class="btn btn-primary mt-2">{{ cta_label or 'Return Home' }}</a>
</div>
{% endblock %}
