{% extends "base.html" %}

{% block content %}
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-label">ADMIN</div>
    <nav class="sidebar-nav">
      <a href="/admin" class="sidebar-link {% if request.url.path == '/admin' or request.url.path == '/admin/' %}active{% endif %}">Overview</a>
      <a href="/admin/tributes" class="sidebar-link {% if '/admin/tributes' in request.url.path %}active{% endif %}">Tributes</a>
      <a href="/admin/markets" class="sidebar-link {% if '/admin/markets' in request.url.path %}active{% endif %}">Markets</a>
      <a href="/admin/phases" class="sidebar-link {% if '/admin/phases' in request.url.path %}active{% endif %}">Phases</a>
      <a href="/admin/alliances" class="sidebar-link {% if '/admin/alliances' in request.url.path %}active{% endif %}">Alliances</a>
      <a href="/admin/parlays" class="sidebar-link {% if '/admin/parlays' in request.url.path %}active{% endif %}">Parlays</a>
      <a href="/admin/chips" class="sidebar-link {% if '/admin/chips' in request.url.path %}active{% endif %}">Chips</a>
      <a href="/admin/settings" class="sidebar-link {% if '/admin/settings' in request.url.path %}active{% endif %}">Settings</a>
    </nav>
  </aside>
  <div class="admin-content">
    {% block admin_content %}{% endblock %}
  </div>
</div>
{% endblock %}
