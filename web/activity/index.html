<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- %%BASE%% is rewritten server-side to /activity/ (standalone) or /.proxy/activity/ (in Discord)
       so every relative asset URL resolves through Discord's proxy. -->
  <base href="%%BASE%%">
  <title>Panem Sportsbook</title>
  <link rel="stylesheet" href="static/style.css?v=%%VERSION%%">
  <script>
    // Runtime config injected by web/app.py. proxy is "/.proxy" inside Discord, "" otherwise.
    window.__ACTIVITY__ = { proxy: "%%PROXY%%", clientId: "%%CLIENT_ID%%" };
  </script>
</head>
<body>
  <div id="app">
    <div id="loading" class="loading">
      <div class="loading-crest"><img src="static/panem.png" alt="⚔" class="loading-logo"></div>
      <div class="loading-text">Entering Panem…</div>
    </div>
  </div>
  <script type="module" src="static/app.js?v=%%VERSION%%"></script>
</body>
</html>
