[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thg-sportsbook"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "discord.py==2.7.1",
    "sqlalchemy[asyncio]==2.0.41",
    "aiosqlite==0.21.0",
    "aiohttp==3.12.4",
    "pillow==11.2.1",
    "python-dotenv==1.1.0",
]

[project.scripts]
thg-sportsbook = "bot.main:main"

[tool.setuptools.packages.find]
include = ["bot*"]
