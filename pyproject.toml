[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thg-sportsbook"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "discord.py==2.7.1",
    "sqlalchemy[asyncio]==2.0.41",
    "aiosqlite==0.21.0",
    "aiohttp==3.12.4",
    "pillow==11.2.1",
    "python-dotenv==1.1.0",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "httpx==0.28.0",
    "itsdangerous==2.2.0",
    "jinja2==3.1.4",
    "python-multipart==0.0.12",
]

[project.scripts]
thg-sportsbook = "bot.main:main"
thg-sportsbook-web = "web.main:main"

[tool.setuptools.packages.find]
include = ["bot*", "web*"]

[tool.setuptools.package-data]
"web" = ["templates/**/*", "static/**/*", "activity/**/*", "activity/static/**/*"]
